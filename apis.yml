aid: levee-medical
name: Levee Medical
description: 'Levee Medical, Inc. is a privately held, clinical-stage medical device company headquartered
  in Durham, North Carolina, developing the Voro Urologic Scaffold — a bioabsorbable implant designed
  to support and stabilize the bladder neck and urethra following radical prostatectomy, in order to accelerate
  the return of continence and reduce the risk of chronic post-prostatectomy urinary incontinence. The
  device is investigational, is not approved for commercial sale, and is being evaluated in the FDA-approved
  ARID II IDE multicenter randomized pivotal trial. The company was founded in 2018 and has raised Series
  A and Series B financing. Levee Medical is a physical medical device manufacturer: it publishes no public
  API, developer portal, SDK, or machine-readable specification, and its only web surface is a WordPress
  marketing and clinical-trial site.'
